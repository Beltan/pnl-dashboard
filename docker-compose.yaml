name: pnl-dashboard

services:
  dashboard:
    build: .
    image: pnl-dashboard:latest
    container_name: pnl-dashboard
    restart: unless-stopped
    env_file: .env
    # Published on every interface: the host's firewall is what decides who reaches it. Basic auth
    # is the only thing in front of the data, so AUTH_PASSWORD has to be set.
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # History outlives the container. Without this a rebuild starts every address's backfill again
    # from its first transaction. A named volume rather than a bind mount, so it keeps the image's
    # ownership and the unprivileged process can write to it.
    volumes:
      - history:/app/data

volumes:
  history:
